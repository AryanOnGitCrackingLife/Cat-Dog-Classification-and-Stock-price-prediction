<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            /* Green/Cyan Gradient for Finance Context */
            --accent-color: #10b981;
            --accent-gradient: linear-gradient(45deg, #10b981, #3b82f6);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 {
            top: 10%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: #059669; /* Emerald */
        }
        .blob-2 {
            bottom: 15%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: #2563eb; /* Blue */
            animation-delay: -2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(20px, 40px); }
            100% { transform: translate(0, 0); }
        }

        /* Glass Container */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 50px 40px;
            width: 90%;
            max-width: 480px;
            border-radius: 30px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Form Elements */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input {
            width: 100%;
            padding: 18px;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            color: white;
            transition: all 0.3s;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: var(--accent-gradient);
            color: white;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* Results Dashboard */
        .result-container {
            margin-top: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            animation: slideUp 0.4s ease-out;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 20px 15px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-box:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #34d399; /* Bright Emerald */
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navigation Link */
        .nav-link {
            display: inline-flex;
            align-items: center;
            margin-top: 30px;
            padding: 12px 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            border-radius: 20px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: white;
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="card">
    <h2>📈 Market Forecast</h2>
    <p class="subtitle">Predict Apple (AAPL) trends using LSTM</p>

    <form method="POST">
        <input type="number" name="years" placeholder="Enter years (e.g., 5)" required>
        <button type="submit">Analyze Market</button>
    </form>

    {% if lr_price %}
        <div class="result-container">
            <div class="stat-box">
                <div class="stat-label">Linear Reg</div>
                <div class="stat-value">₹{{ lr_price | round(2) }}</div>
            </div>
            
            <div class="stat-box">
                <div class="stat-label">LSTM Model</div>
                <div class="stat-value">₹{{ lstm_price | round(2) }}</div>
            </div>
        </div>
    {% endif %}

    <a href="/" class="nav-link">
        &larr; Back to Classifier
    </a>
</div>

</body>
</html>
